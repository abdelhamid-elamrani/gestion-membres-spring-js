<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Document</title>
</head>

<body>
    <nav>
        <ul>
            <li>
                <button id="btnLogout">Se déconnecter</button>
            </li>
            <li>
                <span>bienvenue <span id="namee"></span></span>
            </li>
        </ul>
    </nav>

    <h2> Créer un nouveau membre </h2>

    <div id="message" style="display: none;"></div>

    <form id="createMemberForm">
        <label for="firstName">Prénom:</label>
        <input type="text" id="firstName" name="firstName" required><br><br>

        <label for="lastName">Nom:</label>
        <input type="text" id="lastName" name="lastName" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Téléphone:</label>
        <input type="text" id="phone" name="phone" required><br><br>

        <label for="role">Rôle:</label>
        <select id="role" name="role" required>
            <option value="">Sélectionnez un rôle</option>
            <option value="ADMIN">Admin</option>
            <option value="CLIENT">Client</option>
        </select><br><br>

        <button type="submit">Créer</button>
        <button type="button" id="btnCancel">Annuler</button>
    </form>

    <script src="./js/api.js"></script>
    <script src="./js/adminCreate.js"></script>

</body>

</html>
