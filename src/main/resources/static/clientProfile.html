<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Modifier mon profil</title>
</head>

<body>

    <nav>
        <ul>
            <li>
                <button id="btnLogout">Se déconnecter</button>
            </li>
            <li>
                <span>Bienvenue <span id="namee"></span></span>
            </li>
        </ul>
    </nav>

    <h2>Modifier mon profil</h2>

    <div id="msg" style="display: none;"></div>

    <!-- Formulaire modification profil -->
    <form id="formProfile">
        <h3>Informations personnelles</h3>

        <label>Prénom :</label>
        <input type="text" id="firstName" required>
        <br><br>

        <label>Nom :</label>
        <input type="text" id="lastName" required>
        <br><br>

        <label>Téléphone :</label>
        <input type="text" id="phoneNumbr" required>
        <br><br>

        <label>Email :</label>
        <input type="email" id="email" disabled>
        <br><br>

        <button type="submit">Enregistrer</button>
        <button type="button" id="btnCancel">Annuler</button>
    </form>

    <script src="./js/api.js"></script>
    <script src="./js/clientProfile.js"></script>

</body>

</html>
